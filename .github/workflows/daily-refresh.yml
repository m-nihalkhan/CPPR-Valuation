name: Daily valuation refresh

on:
  schedule:
    - cron: "20 19 * * 1-5"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also send the email (immediately)?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python refresh.py
      - name: Commit updated model and JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add CPPR_Valuation_Model.xlsx data/valuation.json
          git diff --staged --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
      - name: Send 8am email
        if: github.event_name == 'schedule' || inputs.send_email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python send_report.py
